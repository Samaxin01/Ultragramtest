<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultragram Profile</title>

<style>
body {
    margin: 0;
    font-family: Inter, Poppins, system-ui, Arial;
    background: #000;
    color: #fff;
}

/* Header */
.header {
    padding: 15px;
    text-align: center;
    font-size: 20px;
    color: #FFD600;
    font-weight: bold;
}

/* Profile Card */
.card {
    margin: 15px;
    padding: 20px;
    background: #111;
    border-radius: 15px;
    border: 1px solid #FFD600;
    text-align: center;
}

.avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #FFD600;
    margin: auto;
}

/* Info */
.section {
    margin: 15px;
    padding: 15px;
    background: #111;
    border-radius: 12px;
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #222;
}

.row:last-child {
    border-bottom: none;
}

/* NAV */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #0f0f11;
    border-top: 1px solid #222;
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
}

.bottom-nav div {
    text-align: center;
    font-size: 11px;
    color: #888;
}

.bottom-nav i {
    font-size: 18px;
    color: #ffd600;
}

.logout {
    margin: 20px;
    padding: 12px;
    text-align: center;
    background: #ff0000;
    color: rgb(255, 255, 255);
    border-radius: 10px;
    font-weight: bold;
    margin-bottom: 6em;
}
.witbtn {
    margin: 20px;
    padding: 12px;
    text-align: center;
    background: #FFD600;
    color: black;
    border-radius: 10px;
    font-weight: bold;
}
.witbtn:hover{
    background:transparent;
    color: white;
    border: 0.1em solid #ffffff;
}
.logout:hover{
    background:transparent;
    color: white;
    border: 0.1em solid #ffffff;
}
</style>
</head>

<body>

<div class="header">My Profile</div>

<div class="card">
    <div class="avatar">UTG</div>
    <h3 id="email">Loading...</h3>
    <p id="vip">🥇VIP 1</p>
</div>
<div onclick="go('withdraw.html')" class="witbtn">Withdraw</div>
<div class="section">
    <div class="row">
        <span>Email</span>
        <span id="email2">--</span>
    </div>

    <div class="row">
        <span>Balance</span>
        <span id="balance">₦0</span>
    </div>

    <div class="row">
        <span>Date Joined</span>
        <span id="date">--</span>
    </div>

    <div class="row">
        <span>Referrals</span>
        <span id="refs">0</span>
    </div>
</div>


<div class="logout" onclick="logout()">Logout</div>

<!-- NAV -->
<div class="bottom-nav">
    <div onclick="go('dashboard.html')"><i class="fa-solid fa-house"></i><br>Home</div>
    <div onclick="go('task.html')"><i class="fa-solid fa-list"></i><br>Tasks</div>
    <div onclick="go('convert.html')"><i class="fa-solid fa-wallet"></i><br>Convert</div>
    <div onclick="go('referral.html')"><i class="fa-solid fa-users"></i><br>Profile</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDim9k5CHfNythq6ORypN_RfwyLNMuxVLs",
  authDomain: "sign-2fd98.firebaseapp.com",
  projectId: "sign-2fd98",
});

const auth = getAuth(app);
const db = getFirestore(app);

// PROTECT PAGE
onAuthStateChanged(auth, async (user) => {

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    // SHOW EMAIL
    document.getElementById("email").innerText = user.email;
    document.getElementById("email2").innerText = user.email;

    // GET FIRESTORE DATA
    const docRef = doc(db, "users", user.uid);
    const docSnap = await getDoc(docRef);

    if (docSnap.exists()) {
        const data = docSnap.data();

        document.getElementById("balance").innerText = "UTG" + data.balance;
        document.getElementById("date").innerText = data.joinDate;
        document.getElementById("refs").innerText = data.referrals;
    }
});

// LOGOUT
window.logout = function () {
    signOut(auth);
    window.location.href = "login.html";
};
</script>

</body>
</html>
