<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultragram</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #000;
    color: #fff;
    overflow-x: hidden;
}

/* ===== ANIMATIONS ===== */
@keyframes fadeSlide {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes glowPulse {
    0% { box-shadow: 0 0 5px #FFD600; }
    50% { box-shadow: 0 0 20px #FFD600; }
    100% { box-shadow: 0 0 5px #FFD600; }
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-4px); }
    100% { transform: translateY(0px); }
}

/* ===== HEADER ===== */
.header {
    display: flex;
    justify-content: space-between;
    padding: 15px;
    align-items: center;
    animation: fadeSlide 0.6s ease;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #FFD600;
    letter-spacing: 1px;
}

/* ===== ICON ===== */
.icon {
    width: 22px;
    height: 22px;
    fill: #FFD600;
    transition: 0.3s;
}

/* ===== GRID ===== */
.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    padding: 15px;
    text-align: center;
}

.grid div {
    padding: 12px;
    border-radius: 12px;
    background: #111;
    animation: fadeSlide 0.8s ease;
    transition: 0.3s;
}

/* Hover / Tap */
.grid div:active {
    transform: scale(0.92);
}

/* Floating effect */
.grid div svg {
    animation: float 3s ease-in-out infinite;
}

.grid span {
    display: block;
    margin-top: 6px;
    font-size: 12px;
}

/* ===== CARD ===== */
.card {
    background: #111;
    margin: 15px;
    padding: 15px;
    border-radius: 15px;
    border: 1px solid #FFD600;
    animation: fadeSlide 1s ease;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* Glow */
.card:hover {
    animation: glowPulse 2s infinite;
}

.card h2 {
    color: #FFD600;
}

/* ===== BUTTON ===== */
.btn {
    background: #FFD600;
    color: black;
    padding: 10px;
    border: none;
    border-radius: 10px;
    width: 100%;
    margin-top: 10px;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    box-shadow: 0 0 15px #FFD600;
}

.btn:active {
    transform: scale(0.95);
}

/* ===== NAV ===== */
.nav {
    position: fixed;
    bottom: 0;
    width: 100%;
    display: flex;
    background: #111;
    justify-content: space-around;
    padding: 10px 0;
    animation: fadeSlide 1.2s ease;
}

.nav div {
    text-align: center;
    font-size: 12px;
    transition: 0.3s;
}

.nav div:active {
    transform: scale(0.9);
}

</style>
</head>

<body>

<div class="header">
    <svg class="icon" viewBox="0 0 24 24">
        <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
    </svg>

    <div class="logo">Ultragram</div>

    <svg class="icon" viewBox="0 0 24 24">
        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.1-1.6-5.6-4.5-6.3V4c0-.8-.7-1.5-1.5-1.5S10.5 3.2 10.5 4v.7C7.6 5.4 6 7.9 6 11v5l-2 2v1h16v-1l-2-2z"/>
    </svg>
</div>
        <!-- imags intro -->
          <div class="slider">
        <img src="img/Boltz img 1.jpg" class="slide">
        <img src="img/Boltz img 2.jpg" class="slide">
        <img src="img/Boltz img 3.jpg" class="slide">
        <img src="img/Boltz img 4.jpg" class="slide">
    </div>

    
<div class="grid">
    <div><svg class="icon" viewBox="0 0 24 24"><path d="M12 1v22M1 12h22"/></svg><span>Fund</span></div>
    <div><svg class="icon" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/></svg><span>Tasks</span></div>
    <div><svg class="icon" viewBox="0 0 24 24"><path d="M3 17h4v4H3v-4zm7-7h4v11h-4V10zm7-5h4v16h-4V5z"/></svg><span>Surveys</span></div>
    <div><svg class="icon" viewBox="0 0 24 24"><path d="M16 11c1.7 0 3-1.3 3-3S17.7 5 16 5s-3 1.3-3 3 1.3 3 3 3zM8 11c1.7 0 3-1.3 3-3S9.7 5 8 5 5 6.3 5 8s1.3 3 3 3z"/></svg><span>Invite</span></div>
    <div><svg class="icon" viewBox="0 0 24 24"><path d="M12 17l-5 3 1-5-4-4 5-.7L12 5l3 5.3 5 .7-4 4 1 5z"/></svg><span>Rewards</span></div>
    <div><svg class="icon" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg><span>Check-in</span></div>
    <div><svg class="icon" viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.9V17h2V9L12 3z"/></svg><span>Tutorials</span></div>
    <div><svg class="icon" viewBox="0 0 24 24"><path d="M12 1a9 9 0 00-9 9v4a3 3 0 003 3h2v-8H6v-2a6 6 0 1112 0v2h-2v8h2a3 3 0 003-3v-4a9 9 0 00-9-9z"/></svg><span>Support</span></div>
</div>

<div class="card">
    <h2>Starter Tasks</h2>
    <p>Earn daily by completing tasks</p>
    <p>Reward: ₦200 - ₦2,000</p>
    <button class="btn">Start Task</button>
</div>

<div class="nav">
    <div>Home</div>
    <div>Tasks</div>
    <div>Earnings</div>
    <div>Referrals</div>
    <div>Profile</div>
</div>

</body>
</html>
